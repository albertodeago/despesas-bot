name: PR Check

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:

env:
  NODE_VERSION: 24.10.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Linting and formatting
        run: npm run lint

      - name: Typechecking
        run: npm run ts:check

      - name: Unit Tests
        run: npm run test:coverage

      - name: 'Report Coverage'
        uses: davelosert/vitest-coverage-report-action@v2

  memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Build production image
        run: docker build -t despesas-bot:memory-check .

      - name: Check memory budget without external network access
        run: |
          docker run --rm --network none --memory 256m --memory-swap 256m \
            -e NODE_PATH=/smoke/node_modules \
            -v "$PWD/scripts:/app/scripts:ro" \
            -v "$PWD/node_modules:/smoke/node_modules:ro" \
            despesas-bot:memory-check node scripts/memory-smoke.cjs
